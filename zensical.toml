[project]
site_name = "jira-cli"
site_description = "Terminal-first Jira CLI for developer workflows."
site_url = "https://matcra587.github.io/jira-cli/"
repo_url = "https://github.com/matcra587/jira-cli"
repo_name = "matcra587/jira-cli"
edit_uri = "edit/main/docs/"
copyright = """
<small>Copyright &copy; 2026 Matt Craven &middot; MIT licence.<!-- betterleaks:allow --><br>
A command-line tool for use with Jira&reg;. Not affiliated with or endorsed by Atlassian. Jira&reg; is a registered trademark of Atlassian Pty Ltd.</small>
"""

docs_dir = "docs"
site_dir = "site"

extra_css = ["stylesheets/theme.css", "stylesheets/extra.css"]

nav = [
    { Overview = "index.md" },
    { Install = "installation.md" },
    { "Output & exit codes" = "output.md" },
    { "Release Notes" = "changelog.md" },
]

# ----------------------------------------------------------------------------
# Validation: fail the (--strict) build on broken links, anchors, and refs.
# ----------------------------------------------------------------------------
[project.validation]
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true
invalid_links = true
invalid_link_anchors = true

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
# Favicon mirrors the header logo (material/ticket-outline), copied into the
# docs tree at docs/assets/favicon.svg so it ships with the site.
favicon = "assets/favicon.svg"
font.text = "Geist"
font.code = "Geist Mono"
features = [
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.indexes",
    "navigation.path",
    "navigation.top",
    "navigation.footer",
    "header.autohide",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
    "content.tooltips",
    "content.action.edit",
    "content.action.view",
]

[project.theme.icon]
logo = "material/ticket-outline"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Extras
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matcra587/jira-cli"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
[project.markdown_extensions.pymdownx.tilde]

# Mermaid renders through a SuperFences custom fence; zensical takes the
# fence formatter as a plain dotted string (no YAML !!python/name tag).
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
