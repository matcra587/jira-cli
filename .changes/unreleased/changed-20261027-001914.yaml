kind: changed
body: 'Restore jira tui with a new issue home screen, roomier searchable command picker with aligned shortcuts and selected-command explanations, clearer issue columns and aligned status pills that retain color when selected. Browse assigned and project work, search with JQL, load more results and read responsive issue previews; configure public scalar settings in searchable sections with validation, source labels, defaults, explicit saving and cancel; keep settings controls and source labels grouped together on wide terminals; preview display preferences immediately and hot-reload saved settings into the running session. Reload configuration explicitly without restarting; retain scoped drafts, discard stale reads and distinguish saved-but-unapplied failures from publication errors. Restore saved views and lenses, recent issue switching, focus controls, paged comments, returned activity and linked issues. Review transitions, assignments and new comments before submitting them. Mark issues with range, all and invert selection; review bulk transitions, assignments and comments with frozen target keys and per-issue outcomes in session history. Filter loaded issues with text and counted status, assignee and label facets; select rows with the mouse, open issues in a browser and copy keys or URLs through the terminal clipboard. Edit summaries and literal labels with clearly marked add/list focus, review controls, compact centered dialogs with balanced content spacing, an Enter-driven label flow with contextual add/next hints and explicit confirmation with label lists with bold headings, accented counts and indented values, centered controls and a named Apply labels action and responsive key hints, fresh reads, immutable targets, cancel-by-default review and session drafts. Create issues with native project and type choices, summary and Markdown description, labels and assignee; inspect and retain uncertain creation outcomes without automatic replay. Preview theme colors immediately while browsing presets, accept them into the settings draft or restore the prior palette on cancel; adjust row density and choose visible columns. Legacy TUI preference migration remains deferred.'
