kind: changed
body: "Retain classic token and direct 1Password SDK support with profile-selected credential locations, with lazy context-aware resolution and explicit selected-provider provenance. Bind SDK item ownership to the stable managed field, preserve unmanaged content and do not infer ownership from titles/tags. Service tokens remain environment-only. Distinguish canceled or refused provider entry from an entered write with unknown outcome; acknowledged success survives late cancellation. Logout can misreport the environment credential remaining after stored credential removal."
