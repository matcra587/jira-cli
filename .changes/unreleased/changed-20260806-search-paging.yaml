body: "Retain native page metadata, explicit truncation/continuation and validated partial results after later failures. Walk advancing cursors through empty pages; reject repeated or malformed pages. Refuse selector-driven writes unless their complete target set is known. Separate requested output windows, fetched rows, count estimates and authoritative completion; do not infer the end of a collection from a short or empty page alone."
