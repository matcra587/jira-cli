body: "Use `--assignee @me` for current-user resolution instead of `--assignee me`, and `--unassign` instead of `--assignee none` or `--assignee unassigned`. Other write account flags also use `@me`; literal account IDs stay literal. The separate JQL-filter grammar keeps its own `me`/`none` meanings."
