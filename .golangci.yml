version: "2"

run:
  timeout: 5m
  relative-path-mode: cfg
  tests: true

linters:
  # Reasonable default set, then explicitly enable important ones.
  default: standard

  enable:
    # Core correctness / safety
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - gosec
    - ineffassign
    - misspell
    - staticcheck
    - unused

    # Robustness
    - contextcheck
    - containedctx
    - durationcheck
    - sqlclosecheck
    - nolintlint

    - gocheckcompilerdirectives  # catch malformed //go: build-tag directives
    - testifylint                # idiomatic testify assertions

    # gocritic is enabled ONLY to run our ruleguard rule (see settings below);
    # all its tag-grouped style/diagnostic checks stay off, so it adds no noise.
    - gocritic

  # Policy-heavy linters such as revive, unparam, and wrapcheck are
  # intentionally deferred until the first-pass implementation is cleaned up
  # enough for those checks to be useful instead of noisy. gocritic is on but
  # scoped to ruleguard only.

  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - "$all"
          allow:
            - $gostd
            - github.com/gechr/clog
          deny:
            - pkg: "log"
              desc: "use github.com/gechr/clog instead of the standard log package"
            - pkg: "log/slog"
              desc: "use github.com/gechr/clog instead of log/slog"
            - pkg: "io/ioutil"
              desc: "deprecated since Go 1.16; use io and os packages"

    errcheck:
      check-blank: true
      # AsType returns a matched value and a boolean, not a new error to handle.
      exclude-functions:
        - errors.AsType

    gocritic:
      # gocritic is enabled solely to run the custom ruleguard rule. disable-all
      # turns off every built-in check (the team deferred gocritic's style /
      # diagnostic checks as noisy); only ruleguard is re-enabled.
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          failOn: all
          rules: "ruleguard/rules.go"

    gosec:
      includes:
        - G101
        - G102
        - G103
        - G106
        - G107
        - G108
        - G109
        - G110
        - G111
        - G201
        - G202
        - G203
        - G204
        - G301
        - G302
        - G303
        - G304
        - G305
        - G306
        - G307
        - G401
        - G402
        - G403
        - G404
        - G501
        - G502
        - G503
        - G504
      config:
        G101:
          pattern: "(?i)passwd|pass|password|pwd|secret|private_key|token|api_key"
          ignore_entropy: false
          entropy_threshold: "80.0"
          per_char_threshold: "3.0"
          truncate: "32"
        G306: "0750"
        global:
          audit: enabled
          nosec: enabled

    misspell:
      locale: US

  exclusions:
    rules:
      # Tests remain fully linted; only deliberate explicit assignment of an
      # error result to the blank identifier is excluded there. Production
      # files receive no errcheck exclusion.
      - path: '_test\.go$'
        linters:
          - errcheck
        text: 'Error return value( of .*)? is not checked'
        source: '[[:space:]]_[[:space:]]*:?='
      - path: '(.+_test\.go|^internal/testutil/|^tests/live/)'
        linters:
          - gosec
        text: "G101|G204|G304|G306"
      # The ruleguard blocking-call rule targets production command code. Test
      # files legitimately call local stores (e.g. credential keyring .Get) with
      # cmd.Context() and never render a spinner, so exempt them.
      - path: '_test\.go$'
        linters:
          - gocritic
      # cmdutil is the flag register-and-extend wrapper layer: its flags.go and
      # bundlers (parallelism.go, …) call the raw pflag setters on purpose, so
      # the ruleguard raw-pflag-declaration rule must not fire here.
      - path: '^internal/cli/cmdutil/'
        linters:
          - gocritic
      - path: '(^|.*/)internal/(cli/stdin/stdin|editor/roundtrip)\.go$'
        linters:
          - gosec
        text: "G304"
      - path: '(^|.*/)internal/cache/cache\.go$'
        linters:
          - gosec
        text: "G304"
      - path: '(^|.*/)internal/docs/markdown\.go$'
        linters:
          - gosec
        text: "G304"
      - path: '(^|.*/)cmd/gen-docs/main\.go$'
        linters:
          - gosec
        text: "G304"
      - path: '(^|.*/)internal/(cli/alias/alias|config/loader|config/query)\.go$'
        linters:
          - gosec
        text: "G304"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
