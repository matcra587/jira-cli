#:schema https://mise.en.dev/schema/mise.json
min_version = "2026.5.0"

[settings]
lockfile = true

[tools]
# @clover: constraint=minor tags=go
go = "1.27.1"
# Use the release binary locally and the same version in the shared CI workflow.
# @clover: constraint=major tags=golangci-lint
golangci-lint = "2.13.2"
# @clover: constraint=major tags=actionlint
actionlint = "1.7.12"
# @clover: constraint=major tags=betterleaks
betterleaks = "1.8.1"
# @clover: constraint=major tags=goreleaser
goreleaser = "2.18.1"
# @clover: constraint=major tags=changie
changie = "1.26.0"
# @clover: constraint=major tag-prefix=jq- tags=jq
jq = "1.8.2"
# @clover: constraint=major tags=cosign
cosign = "3.1.3"
# @clover: constraint=major tags=zizmor
zizmor = "1.30.1"
# @clover: constraint=major tags=rumdl
rumdl = "0.2.71"
# @clover: id=hk constraint=major tags=hk
hk = "1.58.1"
# @clover: constraint=major tags=pkl
pkl = "0.32.1"
# @clover: constraint=major tags=shellcheck
shellcheck = "0.11.0"
# @clover: constraint=major tags=uv
uv = "0.12.13"

[env]
HK_MISE = 1
MODULE = "github.com/matcra587/jira-cli"
BINARY_NAME = "jira"
DIST_DIR = "./dist"

[task_config]
includes = ["tasks.toml"]
