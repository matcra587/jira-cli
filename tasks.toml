#:schema https://mise.en.dev/schema/mise-task.json

[default]
description = "List available tasks"
quiet = true
run = "mise tasks"

[check]
description = "Run local verification checks"
depends = ["fmt:check", "lint", "rumdl", "vet", "test"]

[ci]
description = "Run CI-equivalent checks"
depends = ["check", "test:race", "test:matrix", "test:live:guards", "test:hooks", "audit", "tidy", "workflow:lint", "security"]

[fix]
description = "Apply automatic formatting and lint fixes"
depends = ["fmt", "lint:fix", "rumdl:fix"]

[build]
description = "Build the binary"
alias = "b"
file = ".mise/tasks/build"
sources = [
  "**/*.go",
  "go.mod",
  "go.sum",
  ".mise/tasks/build",
  ".mise/tasks/lib/build-env.sh",
]
outputs = ["{{ env.DIST_DIR }}/{{ env.BINARY_NAME }}-*"]

[install]
description = "Install binary to GOPATH/bin"
file = ".mise/tasks/install"

[run]
description = "Build and run"
alias = "r"
depends = ["build"]
raw_args = true
run = '"${DIST_DIR}/${BINARY_NAME}-$(go env GOOS)-$(go env GOARCH)"'

["release:check"]
description = "Run GoReleaser config and environment checks"
run = ["goreleaser check", "goreleaser healthcheck"]

["release:preflight"]
description = "Run the full local preflight used before publishing releases"
run = ["mise run ci", "mise run release:check", "mise run release:build"]

[release]
description = "Validate, tag and push a release"
raw_args = true
file = ".mise/tasks/release"

["release:build"]
description = "Build binaries with GoReleaser without publishing"
run = "goreleaser build --snapshot --clean"

["release:snapshot"]
description = "Build a full snapshot release locally"
run = "goreleaser release --snapshot --clean"

[test]
description = "Run tests with coverage"
alias = "t"
run = "go test -v -cover ./..."

["test:all"]
description = "Run all tests without cache"
run = "go test -count=1 ./..."

["test:race"]
description = "Run tests with race detection"
env = { CGO_ENABLED = "1" }
run = "go test -v -race -cover ./..."

["test:matrix"]
description = "Run every required command/flag acceptance pair"
run = "go test -v -tags=flagmatrix -count=1 ./tests/matrix"

["test:live:guards"]
description = "Run hermetic live-test ownership and cleanup guards"
# CI must never inherit opt-in for real Jira writes. Run the complete tagged
# package so new guards participate without extending a test-name filter.
env = { JIRA_LIVE_ACCEPTANCE = "0" }
run = "go test -v -tags=live -count=1 ./tests/live"

["test:hooks"]
description = "Validate hook configuration and native formatter cases"
run = ["hk validate", "hk test --step gofumpt"]

["test:keyring"]
description = "Verify Linux authentication against a private native keyring"
run = """
if [ "$(go env GOHOSTOS)" != "linux" ]; then
  echo "The native keyring gate requires Linux." >&2
  exit 1
fi
go test -v -tags=nativekeyring -count=1 -timeout=3m -run='^TestNativeKeyring' ./tests/contract
"""

["test:cache-sync"]
description = "Verify Linux cache publication with native sync fault injection"
run = """
if [ "$(go env GOHOSTOS)" != "linux" ]; then
  echo "The native cache sync gate requires Linux." >&2
  exit 1
fi
if ! command -v strace >/dev/null 2>&1; then
  echo "The native cache sync gate requires strace." >&2
  exit 1
fi
go test -v -tags=nativecachesync -count=1 -timeout=3m -run='^TestDiskCacheNativeSync' ./internal/adapters
"""

["test:query-swap"]
description = "Verify Linux saved-query reads during native pathname replacement"
run = """
if [ "$(go env GOHOSTOS)" != "linux" ] || [ "$(go env GOOS)" != "linux" ]; then
  echo "The native saved-query swap gate requires Linux host and target." >&2
  exit 1
fi
# The test requires strace or JIRA_TEST_STRACE and fails if tracing is unavailable.
go test -v -tags=queryswap -count=1 -timeout=60s -run='^TestSavedQueryFileSwapKeepsOpenedRegularSnapshot$' ./tests/contract
"""

# The metadata-driven anti-gap suite (tests/audit): exact-leaf inventory,
# expected-cell matrix, corpus captures of the real binary, agent-dx
# checklist. Hermetic — httptest loopback only, guarded by an unroutable
# proxy. Regenerate the committed baseline deliberately with
# AUDIT_UPDATE_MATRIX=1 in the same change that moves a cell.
[audit]
description = "Run the output-contract audit suite"
run = "go test -tags=outputaudit -count=1 ./tests/audit/"

[fmt]
description = "Format repository Go source with gofumpt"
run = '''
#!/usr/bin/env bash
set -o pipefail
git ls-files --cached --others --exclude-standard -z -- '*.go' |
while IFS= read -r -d '' source_file; do
  if [ -f "$source_file" ] && [ ! -L "$source_file" ]; then
    printf '%s\0' "$source_file"
  fi
done |
xargs -0 sh -c 'if [ "$#" -gt 0 ]; then exec go tool gofumpt -w -- "$@"; fi' --
'''

["fmt:check"]
description = "Check Go formatting"
# The || exit 1 matters: command substitution swallows a missing or crashing
# gofumpt, and an empty capture would pass the gate vacuously.
# Git's inventory includes new source files and respects local exclusions.
# Preserve NUL separators for filenames containing spaces or newlines.
run = '''
#!/usr/bin/env bash
set -o pipefail
out="$(
  git ls-files --cached --others --exclude-standard -z -- '*.go' |
  while IFS= read -r -d '' source_file; do
    if [ -f "$source_file" ] && [ ! -L "$source_file" ]; then
      printf '%s\0' "$source_file"
    fi
  done |
  xargs -0 sh -c 'if [ "$#" -gt 0 ]; then exec go tool gofumpt -l -- "$@"; fi' --
)" || exit 1
test -z "$out"
'''

["fmt:file"]
description = "Format Go file(s) with gofumpt"
raw_args = true
run = "go tool gofumpt -w"

[lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

["lint:fix"]
description = "Run golangci-lint with auto-fix"
run = "golangci-lint run --fix"

[rumdl]
description = "Lint markdown files with rumdl"
run = "git ls-files '*.md' | xargs -r rumdl check"

["rumdl:fix"]
description = "Fix markdown files with rumdl"
raw_args = true
run = "git ls-files '*.md' | xargs -r rumdl fmt"

[vet]
description = "Run go vet"
run = "go vet ./..."

[security]
description = "Run govulncheck"
run = "go tool govulncheck ./..."

["workflow:lint"]
description = "Lint GitHub Actions workflows"
run = ["actionlint .github/workflows/*.yml", "zizmor --persona pedantic .github/"]

[pre-commit]
description = "Run hk pre-commit hook"
run = "hk run pre-commit"

# Read-only freshness probe for the vendored upstream artifacts. Never in
# ci — it needs the network; run deliberately or from cron.
[upstream-check]
description = "Check vendored specs/schemas against live upstream (--type adf|api, --check to gate)"
raw_args = true
file = ".mise/tasks/upstream-check"

[deps]
description = "Download Go module dependencies"
run = "go mod download"

["docs:build"]
description = "Build the documentation site with strict validation"
run = "uvx --from zensical==0.0.60 zensical build --clean --strict -f zensical.toml"

["docs:serve"]
description = "Serve the documentation site with live reload"
raw_args = true
file = ".mise/tasks/docs-serve"

["deps:update"]
description = "Update direct Go dependencies to latest patch releases"
env = { DEPS_UPDATE_QUERY = "patch" }
file = ".mise/tasks/deps-update"

["deps:update:minor"]
description = "Update direct Go dependencies to latest minor and patch releases"
env = { DEPS_UPDATE_QUERY = "latest" }
file = ".mise/tasks/deps-update"

[tidy]
description = "Tidy Go modules and verify no drift"
run = ["go mod tidy", "git diff --exit-code -- go.mod go.sum"]

[generate]
description = "Run go generate"
run = "go generate ./..."

[clean]
description = "Remove build and coverage outputs"
run = "rm -rf bin dist coverage.out"

[version]
description = "Print build version info"
quiet = true
file = ".mise/tasks/version"

["check-changie"]
description = "Fail a feat/fix commit that ships no changelog fragment"
usage = 'arg "<commit_msg_file>" help="Path to the commit message file to check"'
run = "go run ./cmd/check-changie {{usage.commit_msg_file}}"

["release-notes"]
description = "Batch unreleased fragments into a version and regenerate the changelog"
usage = 'arg "<version>" help="Release version, e.g. v0.7.8"'
run = [
    "changie batch {{usage.version}}",
    "changie merge",
]
