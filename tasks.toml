#:schema https://mise.en.dev/schema/mise-task.json

[default]
description = "List available tasks"
quiet = true
run = "mise tasks"

[check]
description = "Run local verification checks"
depends = ["fmt:check", "lint", "rumdl", "vet", "test"]

[ci]
description = "Run CI-equivalent checks"
depends = ["check", "test:integration", "tidy", "workflow:lint", "security"]

[fix]
description = "Apply automatic formatting and lint fixes"
depends = ["fmt", "lint:fix", "rumdl:fix"]

[build]
description = "Build the binary"
alias = "b"
file = ".mise/tasks/build"
sources = [
  "**/*.go",
  "go.mod",
  "go.sum",
  ".mise/tasks/build",
  ".mise/tasks/lib/build-env.sh",
]
outputs = ["{{ env.DIST_DIR }}/{{ env.BINARY_NAME }}-*"]

[install]
description = "Install binary to GOPATH/bin"
file = ".mise/tasks/install"

[run]
description = "Build and run"
alias = "r"
depends = ["build"]
raw_args = true
run = '"${DIST_DIR}/${BINARY_NAME}-$(go env GOOS)-$(go env GOARCH)"'

["release:check"]
description = "Run GoReleaser config and environment checks"
run = ["goreleaser check", "goreleaser healthcheck"]

["release:preflight"]
description = "Run the full local preflight used before publishing releases"
run = ["mise run ci", "mise run release:check", "mise run release:build"]

[release]
description = "Validate, tag and push a release"
raw_args = true
file = ".mise/tasks/release"

["release:build"]
description = "Build binaries with GoReleaser without publishing"
run = "goreleaser build --snapshot --clean"

["release:snapshot"]
description = "Build a full snapshot release locally"
run = "goreleaser release --snapshot --clean"

[test]
description = "Run tests with coverage"
alias = "t"
run = "go test -v -cover ./..."

["test:all"]
description = "Run all tests without cache"
run = "go test -count=1 ./..."

["test:race"]
description = "Run tests with race detection"
env = { CGO_ENABLED = "1" }
run = "go test -v -race -cover ./..."

["test:integration"]
description = "Run integration tests"
# The quickstart test builds the CLI; under a parallel `mise run ci` the Go
# build locks and CPU are contended, so the budget must absorb a full cold
# build, not just test runtime.
run = "go test -v -tags=integration ./tests/integration -count=1 -timeout 300s"

["test:docs"]
description = "Run the docs-alignment contract tests (README, agent guide, docs site)"
# Gated behind the docs_alignment build tag so they stay out of the default
# `go test ./...` and the release preflight. They assert doc *content*, not
# code, so a docs edit should never block a release.
run = "go test -v -tags=docs_alignment ./tests/contract -run 'Artifacts|Readme|HumanDocs|AgentGuide|JQLDocs|DocsSite|OnePassword' -count=1"

["test:live"]
description = "Run every live Jira end-to-end suite (needs JIRA_LIVETEST_PROJECT and a configured profile)"
run = "go test -v -tags live -count=1 -timeout 20m ./tests/live/..."

["test:live:issues"]
description = "Run the live Jira issue and worklog end-to-end suite"
run = "go test -v -tags live -count=1 -timeout 20m ./tests/live/issues/..."

[fmt]
description = "Format code with gofmt and gofumpt"
run = ["go fmt ./...", "go tool gofumpt -w ."]

["fmt:check"]
description = "Check Go formatting"
run = 'test -z "$(go tool gofumpt -l .)"'

["fmt:file"]
description = "Format Go file(s) with gofumpt"
raw_args = true
run = "go tool gofumpt -w"

[lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

["lint:fix"]
description = "Run golangci-lint with auto-fix"
run = "golangci-lint run --fix"

[rumdl]
description = "Lint markdown files with rumdl"
run = "git ls-files '*.md' | xargs -r rumdl check"

["rumdl:fix"]
description = "Fix markdown files with rumdl"
raw_args = true
run = "git ls-files '*.md' | xargs -r rumdl fmt"

[vet]
description = "Run go vet"
run = "go vet ./..."

[security]
description = "Run govulncheck"
run = "go tool govulncheck ./..."

["workflow:lint"]
description = "Lint GitHub Actions workflows"
run = ["actionlint .github/workflows/*.yml", "zizmor --persona pedantic .github/"]

[pre-commit]
description = "Run hk pre-commit hook"
run = "hk run pre-commit"

[deps]
description = "Download Go module dependencies"
run = "go mod download"

["docs:gen"]
description = "Generate the command reference from the Cobra tree into docs/reference (gitignored) and refresh the reference nav block in zensical.toml"
# --clean drops pages for deleted commands; --nav-config rewrites the generated
# reference-nav block. gen-docs does its own clean/mkdir, so no shell rm/mkdir
# (which keeps the task portable to Windows).
run = "go run ./cmd/gen-docs --website --clean --doc-path docs/reference --nav-config zensical.toml"

["docs:nav-check"]
description = "Fail if the reference nav in zensical.toml has drifted from the Cobra command tree"
run = "go run ./cmd/gen-docs --nav-config zensical.toml --check"

["docs:build"]
description = "Build the documentation site"
depends = ["docs:gen"]
# clover: provider=pypi id=zensical package=zensical constraint=major
run = "uvx --from zensical==0.0.60 zensical build --clean --strict"

["docs:serve"]
description = "Serve the documentation site locally"
depends = ["docs:gen"]
raw_args = true
file = ".mise/tasks/docs-serve"

["deps:update"]
description = "Update direct Go dependencies to latest patch releases"
env = { DEPS_UPDATE_QUERY = "patch" }
file = ".mise/tasks/deps-update"

["deps:update:minor"]
description = "Update direct Go dependencies to latest minor and patch releases"
env = { DEPS_UPDATE_QUERY = "latest" }
file = ".mise/tasks/deps-update"

[tidy]
description = "Tidy Go modules and verify no drift"
run = ["go mod tidy", "git diff --exit-code -- go.mod go.sum"]

[generate]
description = "Run go generate"
run = "go generate ./..."

[clean]
description = "Remove build and coverage outputs"
run = "rm -rf bin dist coverage.out"

[version]
description = "Print build version info"
quiet = true
file = ".mise/tasks/version"

["check-changie"]
description = "Fail a feat/fix commit that ships no changelog fragment"
usage = 'arg "<commit_msg_file>" help="Path to the commit message file to check"'
run = "go run ./cmd/check-changie {{usage.commit_msg_file}}"

["release-notes"]
description = "Batch unreleased fragments into a version and regenerate the changelog"
usage = 'arg "<version>" help="Release version, e.g. v0.7.8"'
run = [
    "changie batch {{usage.version}}",
    "changie merge",
]
