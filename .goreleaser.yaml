# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: jira
report_sizes: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy

builds:
  - id: jira
    main: ./cmd/jira
    binary: jira
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Ship darwin/arm64, linux/amd64+arm64, and windows/amd64+arm64. Intel
    # macOS is not a release target, so drop the darwin/amd64 combination.
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    # Version resolution is delegated to clive, so the version ldflag targets
    # clive's injection point. Commit and build time come from the VCS
    # metadata Go embeds at build time. 0.15 also injected Branch/BuildBy
    # into internal/version; that package is gone — the 0.16 version command
    # decides whether they return.
    ldflags:
      - -s -w
      - -X 'github.com/gechr/clive.version={{ .Version }}'
      - -X 'github.com/matcra587/jira-cli/internal/selfupdate.buildSource=goreleaser'

archives:
  - id: default
    ids:
      - jira
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

scoops:
  - repository:
      owner: matcra587
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/matcra587/jira-cli
    description: Agent-first Jira CLI for developer workflows
    license: MIT
    commit_msg_template: "jira: {{ .Tag }}"

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^style:"
      - "^chore:"
      - "^ci:"
      - "^test:"
