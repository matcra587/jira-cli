---
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly advisory sweep — new CVEs land without commits.
    - cron: "0 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security
    # @clover: constraint=major tag-prefix=security/ tags=actions
    uses: matcra587/github-actions/.github/workflows/security.yml@d2ae464e93461998e97ebc72c4f3de40ac0a84df # security/v0.4.3
    permissions:
      contents: read
      security-events: write # SARIF + CodeQL uploads to code scanning.
    with:
      sarif: true
