---
name: ci

on:
  pull_request:
  push:
    branches:
      - main

# Pull requests cancel superseded runs per ref; pushes to main get one group
# per commit so a rapid series of pushes never cancels the gate run a release
# tag is waiting on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: Release gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # GoReleaser refuses shallow clones; it needs tags for snapshot versioning.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: true

      # Caching lives here rather than in the release workflow so release
      # artifacts are never built from cached state: this job only validates.
      # Covers the Go module cache, the Go build cache, and golangci-lint's
      # analysis cache. The key carries a UTC date on top of the dependency
      # and toolchain pins: GHA caches are immutable, so without a churn
      # component the saved build cache never refreshes as our own source
      # changes, and hit rates decay until go.sum next moves. This job runs
      # only on pushes to main, so saves are main-only by construction;
      # subsequent runs restore the latest save via the prefix fallbacks.
      - name: Compute cache date
        id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        # clover: provider=auto constraint=minor tags=cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.lock') }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.lock') }}-
            go-${{ runner.os }}-

      # -count=1 disables Go's test-result caching (build caching is
      # unaffected). Several contract tests exec a binary built from the
      # tree; the test cache hashes only the test package's source, so a
      # restored cache could replay a stale pass after the binary's
      # behavior changed. Independently, fixture-reading suites (ADF
      # goldens and friends) would rarely hit anyway: Go hashes opened
      # files by mtime (golang/go#58571), which a fresh checkout resets.
      - name: Run CI gate
        env:
          GOFLAGS: -count=1
        run: mise run ci

      # Catches cross-compile breakage (platform-specific code) at push time
      # instead of at tag time. The snapshot artifacts are discarded; the
      # release workflow rebuilds from scratch, uncached.
      - name: Cross-platform build check
        run: mise run release:build

  go-test:
    name: Go test
    if: github.event_name == 'pull_request'
    # clover: provider=auto tags=actions
    uses: matcra587/github-actions/.github/workflows/go-test.yml@67f0de0d0ceebe69895e868207c04e5c66b3bde8
    permissions:
      contents: read

  go-lint:
    name: Go lint
    if: github.event_name == 'pull_request'
    # clover: provider=auto tags=actions
    uses: matcra587/github-actions/.github/workflows/go-lint.yml@67f0de0d0ceebe69895e868207c04e5c66b3bde8
    permissions:
      contents: read

  md-lint:
    name: Markdown lint
    if: github.event_name == 'pull_request'
    # clover: provider=auto tags=actions
    uses: matcra587/github-actions/.github/workflows/md-lint.yml@67f0de0d0ceebe69895e868207c04e5c66b3bde8
    permissions:
      contents: read
