name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.changes/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
      - '.mise.toml'
      - 'mise.lock'
      - 'tasks.toml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read            # Required to check out the repo.
      pages: read               # Required for configure-pages to read Pages settings.
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Configure Pages
        # clover: provider=auto constraint=minor tags=configure-pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      - name: Build site
        run: mise run docs:build

      - name: Upload artifact
        # clover: provider=auto constraint=minor tags=upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write              # Required to publish the Pages artifact.
      id-token: write           # Required for the Pages deploy action's OIDC token.
    steps:
      - name: Deploy
        id: deployment
        # clover: provider=auto constraint=minor tags=deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
