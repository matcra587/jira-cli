name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.changes/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
      - '.mise.toml'
      - 'mise.lock'
      - 'tasks.toml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read            # Required to check out the repo.
      pages: read               # Required for configure-pages to read Pages settings.
    steps:
      - name: Checkout
        # @clover: constraint=major tags=checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        # @clover: constraint=major tags=configure-pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install mise
        # @clover: constraint=major tags=mise-action
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      - name: Build site
        run: mise run docs:build

      - name: Upload artifact
        # @clover: constraint=major tags=upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write              # Required to publish the Pages artifact.
      id-token: write           # Required for the Pages deploy action's OIDC token.
    steps:
      - name: Deploy
        id: deployment
        # @clover: constraint=major tags=deploy-pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
