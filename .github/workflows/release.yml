name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    environment: deploy
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    permissions:
      contents: write           # Required to create GitHub releases and upload assets.
      id-token: write           # Required for cosign via OIDC.
      actions: read             # Required to read the CI gate run for the tagged commit.
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign
        # clover: provider=auto constraint=minor tags=cosign-installer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mise
        # clover: provider=auto constraint=minor tags=mise-action
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: --locked
          cache: false

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: '[[ "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Check release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "release ${TAG_NAME} already exists; skipping GoReleaser publish"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      # Validation happens in the ci workflow's push gate, which runs the full
      # `mise run ci` (with caches) on every push to main. This workflow stays
      # cache-free so release artifacts are never built from cached state; it
      # only waits for the gate covering the exact tagged commit to go green.
      - name: Await CI gate for tagged commit
        if: steps.release-state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse "${TAG_NAME}^{commit}")"
          echo "awaiting ci gate for ${sha}"
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&event=push"
          deadline=$((SECONDS + 900))
          grace=$((SECONDS + 180))
          while :; do
            run="$(gh api "${runs_url}" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion)"' 2>/dev/null || true)"
            status="${run%% *}"
            conclusion="${run##* }"
            if [[ -z "${run}" ]]; then
              if ((SECONDS > grace)); then
                echo "no push CI run found for ${sha}." >&2
                echo "only pushed branch tips get a gate run; tag a commit that was the tip of a push." >&2
                exit 1
              fi
            elif [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "ci gate succeeded for ${sha}"
                break
              fi
              echo "ci gate for ${sha} concluded: ${conclusion}" >&2
              exit 1
            fi
            if ((SECONDS > deadline)); then
              echo "timed out waiting for the ci gate on ${sha}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Check GoReleaser configuration
        if: steps.release-state.outputs.exists != 'true'
        run: mise run release:check

      - name: Create packaging token
        id: app-token
        # clover: provider=auto constraint=minor tags=create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write

      - name: Run GoReleaser
        if: steps.release-state.outputs.exists != 'true'
        # clover: provider=auto constraint=minor tags=goreleaser-action
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ~> v2.16
          args: release --clean --release-notes=.changes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Download release checksums
        if: steps.release-state.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --dir dist \
            --clobber

      # GitHub artifact attestations are not available for user-owned private repositories.
      # Re-enable this if the repository becomes public or GitHub supports this repository type.
      # - name: Attest release artifact provenance
      #   if: steps.release-state.outputs.exists != 'true'
      #   uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
      #   with:
      #     subject-checksums: dist/checksums.txt

      - name: Publish Homebrew formula
        # clover: provider=auto constraint=minor tags=actions
        uses: matcra587/github-actions/packages/homebrew-publish-formula@6e3053f35d4ec31adc4f82c04a2c43209f3b36e6 # homebrew/v0.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          tap: matcra587/homebrew-tap
          name: jira
          class: Jira
          desc: Agent-first Jira CLI for developer workflows
          homepage: https://github.com/matcra587/jira-cli
          version: ${{ github.ref_name }}
          license: MIT
          checksums-file: dist/checksums.txt
          archive-name-template: "{name}_{version}_{os}_{arch}.tar.gz"
          platforms: |-
            darwin/arm64
            linux/amd64
            linux/arm64
          binary-name: jira
          module-path: github.com/matcra587/jira-cli
          build-package: ./cmd/jira
          head-url: https://github.com/matcra587/jira-cli.git
          head-branch: main
          head-depends-on: go
          completion-args: completion
          test-args: --help
          test-match: Jira CLI
          livecheck: "true"
          commit-message: "jira: v{version}"
